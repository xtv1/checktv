name: Daily Clean IPV4 Live Streams (终极版)

on:
  schedule:
    - cron: '0 8 * * *'          # 北京时间 16:00 每天一次
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg + Parallel
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          install-parallel: true

      - name: Download latest IPV4 list
        run: |
          curl -L -o list.txt \
            https://raw.githubusercontent.com/kimwang1978/collect-txt/refs/heads/main/%E4%B8%93%E5%8C%BA/%E2%99%AA%E4%BC%98%E8%B4%A8%E5%8D%AB%E8%A7%86.txt

      - name: Make script executable
        run: chmod +x .github/scripts/clean-ultimate.sh

      - name: Run ultimate cleaning script
        run: bash .github/scripts/clean-ultimate.sh

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions[bot]@github.com"
          if git diff --quiet list.txt; then
            echo "Today all streams are alive!"
          else
            removed=$(cat /tmp/removed_count || echo 0)
            git add list.txt
            git commit -m "Auto clean: removed $removed dead links [$(date +'%F')]"
            git push
            echo "Pushed new clean list.txt"
          fi

      - name: Upload removed list
        uses: actions/upload-artifact@v4
        with:
          name: removed-${{ github.run_date }}
          path: artifacts/removed_*.txt
