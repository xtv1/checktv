name: Daily Clean Invalid Live Streams (Parallel)

on:
  schedule:
    - cron: '0 8 * * *'          # 每天 UTC 8:00 → 北京时间 16:00
  workflow_dispatch:             # 支持手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允许自动提交

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg + GNU Parallel
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          install-parallel: true     # 自动安装 parallel 工具

      - name: Download latest source list
        run: |
          curl -L -o list.txt \
            https://raw.githubusercontent.com/alantang1977/X/refs/heads/main/live/live_ipv4.txt

      - name: Make clean script executable        # 关键一步：自动加执行权限
        run: chmod +x .github/scripts/clean-parallel.sh

      - name: Run parallel cleaning script
        run: bash .github/scripts/clean-parallel.sh

      - name: Commit & push new clean list.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet list.txt; then
            echo "Today no dead links, nothing to commit"
          else
            removed=$(cat /tmp/removed_count || echo "0")
            git add list.txt
            git commit -m "Auto clean: removed $removed dead streams [$(date +'%F')]"
            git push
            echo "New clean list.txt has been pushed! (removed $removed dead links)"
          fi

      - name: Upload removed list as artifact      # 方便你随时下载查看被删了哪些
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removed-streams-${{ github.run_date }}
          path: artifacts/removed_*.txt
