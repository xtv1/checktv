name: Check Live Streams

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: '原始直播源文件 URL'
        required: true
        default: 'https://raw.githubusercontent.com/kimwang1978/collect-txt/refs/heads/main/%E4%B8%93%E5%8C%BA/%E2%99%AA%E4%BC%98%E8%B4%A8%E5%8D%AB%E8%A7%86.txt'
      output_path:
        description: '清理后输出到仓库根目录的文件名'
        required: true
        default: 'cleaned_playlist.txt'
      http_concurrency:
        description: 'HTTP 并发'
        required: false
        default: '200'
      ffprobe_concurrency:
        description: 'ffprobe 并发'
        required: false
        default: '40'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install apt deps (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download input file
        run: |
          curl -fsSL "${{ github.event.inputs.input_url }}" -o /tmp/input_playlist.txt

      - name: Run stream checker
        run: |
          python scripts/check_streams.py \
            --input /tmp/input_playlist.txt \
            --output "${{ github.event.inputs.output_path }}" \
            --http-concurrency ${{ github.event.inputs.http_concurrency }} \
            --ffprobe-concurrency ${{ github.event.inputs.ffprobe_concurrency }} \
            --report "stream_report.json"

      - name: Commit & Push cleaned file to repo root
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git add "${{ github.event.inputs.output_path }}" stream_report.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update cleaned playlist: ${{ github.event.inputs.output_path }}"
            git push
          fi

      - name: Upload cleaned file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-playlist
          path: ${{ github.event.inputs.output_path }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: stream-report
          path: stream_report.json
