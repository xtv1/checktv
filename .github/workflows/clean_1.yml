name: Daily Clean（保留分组）

on:
  schedule:
    - cron: '0 8 * * *'      # 每天北京时间 16:00
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions: 
    contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg + GNU Parallel
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          install-parallel: true

      - name: 下载最新源文件
        run: |
          curl -L -o raw.txt \
            https://raw.githubusercontent.com/alantang1977/X/refs/heads/main/live/live_ipv4.txt

      - name: 执行万条级清洗脚本
        run: |
          chmod +x .github/scripts/clean-10w.sh
          bash .github/scripts/clean-10w.sh

      - name: 提交并推送（首次运行也必成功）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"

          git add list.txt
          if git diff --staged --quiet; then
            echo "今日无变化，全量存活！"
          else
            removed=$(cat /tmp/removed_count || echo 0)
            git commit -m "Auto clean: removed $removed dead links | $(date +'%F %T')"
            git push
            echo "成功推送最新干净源（剔除 $removed 条）"
          fi

      - name: 上传被删除列表（方便审计）
        uses: actions/upload-artifact@v4
        with:
          name: removed-$(date +%F)
          path: artifacts/removed_*.txt
